services:
  postgres:
    image: postgres:15-alpine
    container_name: trustcart-postgres
    environment:
      POSTGRES_USER: trustcart
      POSTGRES_PASSWORD: trustcart_local
      POSTGRES_DB: trustcart_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trustcart']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trustcart-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: trustcart-mailhog
    ports:
      - '1025:1025' # SMTP server
      - '8025:8025' # Web UI
    profiles:
      - email

volumes:
  postgres_data:
  redis_data:
